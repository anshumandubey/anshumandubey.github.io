  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nd — owning the backend system architecture and coordinating across dependent teams for a major South Asian online retailer.\", meta: 'Java · Micronaut · Kafka', link: '#work' },\n        { no: '02', tag: 'Thoughtworks', title: 'Brand-Card & B2B Integration', desc: \"Built partner brand-card support and B2B integration from scratch. Improved troubleshooting & system performance 20–30% and drove a 3–5% lift in sales — earning client appreciation.\", meta: 'Java · Microservices · TDD', link: '#work' },\n        { no: '03', tag: 'Freecharge · Axis Bank', title: 'Auto-Loan Module', desc: \"Owned the auto-loan module end to end — shipping new customer-facing capabilities while hardening the core business logic to be more robust and efficient.\", meta: 'Java · Spring Boot · DDD', link: '#work' },\n        { no: '04', tag: 'Bravura Solutions', title: 'Real-Time Analytics Platform', desc: \"Designed highly-available infrastructure for real-time data analysis on a fintech product, and built a microservices suite spanning sentiment analysis, NLP, workflow triggering and its web interface.\", meta: 'Java · NLP · Angular', link: '#work' },\n      ],\n      certs: [\n        { year: '2023', name: 'Oracle Cloud Infrastructure Architect Professional', issuer: 'Oracle' },\n        { year: '2023', name: 'Oracle Cloud Infrastructure Architect Associate', issuer: 'Oracle' },\n        { year: '2022', name: 'Microsoft Certified: Azure Fundamentals (AZ-900)', issuer: 'Microsoft · ID H806-8914' },\n        { year: '2021', name: 'Architecting with Google Cloud Platform Specialization', issuer: 'Google Cloud' },\n      ],\n      links: [\n        { label: 'linkedin', url: 'https://www.linkedin.com/in/anshumandubey' },\n        { label: 'github', url: 'https://github.com/anshumandubey' },\n        { label: 'hackerrank', url: 'https://www.hackerrank.com/imanshumandubey' },\n        { label: 'leetcode', url: 'https://leetcode.com/anshumandubey' },\n      ],\n    };\n  }\n\n  componentDidMount() {\n    const root = document.getElementById('tm-root') || document;\n    const applyCols = () => {\n      const wide = window.innerWidth > 820;\n      root.querySelectorAll('[data-cols]').forEach(e => { e.style.gridTemplateColumns = wide ? '250px 1fr' : '1fr'; });\n      root.querySelectorAll('[data-cols2]').forEach(e => { e.style.gridTemplateColumns = wide ? '1.1fr 0.9fr' : '1fr'; });\n      root.querySelectorAll('[data-job]').forEach(e => { e.style.gridTemplateColumns = wide ? '0.85fr 1.45fr' : '1fr'; });\n    };\n    applyCols();\n    this._onResize = applyCols;\n    window.addEventListener('resize', applyCols);\n\n    // Scroll-progress bar + cursor-following ambient glow (appended to body — React-safe)\n    this._extras = [];\n    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n    const bar = document.createElement('div');\n    bar.style.cssText = 'position:fixed; top:0; left:0; height:2px; width:0%; z-index:99; background:linear-gradient(90deg,#5eead4,#7aa2f7); box-shadow:0 0 10px rgba(94,234,212,0.6); pointer-events:none; transition:width .08s linear;';\n    document.body.appendChild(bar);\n    this._extras.push(bar);\n    const onScroll = () => {\n      const h = document.documentElement.scrollHeight - window.innerHeight;\n      bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';\n    };\n    onScroll();\n    window.addEventListener('scroll', onScroll, { passive: true });\n    this._onScroll = onScroll;\n\n    // Cursor-following ambient glow (desktop only)\n    if (!reduce && window.matchMedia('(pointer:fine)').matches) {\n      const glow = document.createElement('div');\n      glow.style.cssText = 'position:fixed; top:0; left:0; width:520px; height:520px; margin:-260px 0 0 -260px; z-index:1; pointer-events:none; border-radius:50%; background:radial-gradient(circle, rgba(94,234,212,0.10), transparent 62%); transition:transform .18s ease-out; will-change:transform; opacity:0;';\n      document.body.appendChild(glow);\n      this._extras.push(glow);\n      const onMove = (e) => { glow.style.opacity = '1'; glow.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)'; };\n      window.addEventListener('pointermove', onMove, { passive: true });\n      this._onMove = onMove;\n    }\n\n    const items = root.querySelectorAll('[data-reveal]');\n    if ('IntersectionObserver' in window) {\n      const io = new IntersectionObserver((entries) => {\n        entries.forEach(en => { if (en.isIntersecting) { en.target.setAttribute('data-shown', ''); io.unobserve(en.target); } });\n      }, { threshold: 0.1, rootMargin: '0px 0px -6% 0px' });\n      items.forEach(el => io.observe(el));\n      this._io = io;\n    } else {\n      items.forEach(el => el.setAttribute('data-shown', ''));\n    }\n\n    // Typewriter: type each [data-type] the first time it enters view (hero types on load).\n    this._typeTimers = [];\n    const typeEls = root.querySelectorAll('[data-type]');\n    const startType = (el) => {\n      if (el.dataset.typed) return;\n      el.dataset.typed = '1';\n      const full = (el.dataset.fullText != null) ? el.dataset.fullText : el.textContent;\n      el.dataset.fullText = full;\n      if (reduce) { el.textContent = full; return; }\n      // hero name already has a sibling blinking caret; headings get a temporary one.\n      const hasSiblingCaret = el.nextElementSibling && el.nextElementSibling.classList.contains('tm-caret');\n      el.textContent = '';\n      let caret = null;\n      if (!hasSiblingCaret) {\n        caret = document.createElement('span');\n        caret.className = 'tm-caret';\n        caret.style.color = '#5eead4';\n        caret.textContent = '_';\n        el.appendChild(caret);\n      }\n      let i = 0;\n      const speed = 52;\n      const tick = () => {\n        if (i < full.length) {\n          const ch = document.createTextNode(full.charAt(i));\n          if (caret) el.insertBefore(ch, caret); else el.appendChild(ch);\n          i++;\n          this._typeTimers.push(setTimeout(tick, speed + (full.charAt(i-1) === ' ' ? 36 : 0)));\n        } else if (caret) {\n          this._typeTimers.push(setTimeout(() => caret.remove(), 700));\n        }\n      };\n      tick();\n    };\n    if (reduce || !('IntersectionObserver' in window)) {\n      typeEls.forEach(el => { el.dataset.fullText = el.textContent; });\n    } else {\n      const tio = new IntersectionObserver((entries) => {\n        entries.forEach(en => { if (en.isIntersecting) { startType(en.target); tio.unobserve(en.target); } });\n      }, { threshold: 0.6 });\n      typeEls.forEach(el => { el.dataset.fullText = el.textContent; tio.observe(el); });\n      this._tio = tio;\n    }\n    // Safety net: guarantee full text after 6s no matter what.\n    this._typeSafety = setTimeout(() => {\n      typeEls.forEach(el => {\n        if (el.dataset.typed !== '1') { el.textContent = el.dataset.fullText || el.textContent; }\n        const sib = el.nextElementSibling;\n      });\n    }, 6000);\n  }\n\n  componentWillUnmount() {\n    if (this._onResize) window.removeEventListener('resize', this._onResize);\n    if (this._io) this._io.disconnect();\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n    if (this._onMove) window.removeEventListener('pointermove', this._onMove);\n    if (this._extras) this._extras.forEach(el => el.remove());\n    if (this._tio) this._tio.disconnect();\n    if (this._typeTimers) this._typeTimers.forEach(t => clearTimeout(t));\n    if (this._typeSafety) clearTimeout(this._typeSafety);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
